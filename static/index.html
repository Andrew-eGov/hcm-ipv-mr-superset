<!doctype html>
<html lang="en" data-theme="light">
<script>
  // Apply the saved theme before first paint (default: light).
  try { const t = localStorage.getItem("hcm-theme") || "light"; if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex">

<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --card: #ffffff;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --brand: #0b4b66; --accent: #f47738;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --seq1: #cde2fb; --seq2: #86b6ef; --seq3: #5598e7; --seq4: #2a78d6; --seq5: #184f95;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --card: #1a1a19;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --brand: #8cc7e3; --accent: #f4874f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --seq1: #104281; --seq2: #1c5cab; --seq3: #2a78d6; --seq4: #5598e7; --seq5: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --card: #1a1a19;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --brand: #8cc7e3; --accent: #f4874f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --seq1: #104281; --seq2: #1c5cab; --seq3: #2a78d6; --seq4: #5598e7; --seq5: #9ec5f4;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px 0; position: sticky; top: 0; z-index: 1000; }
.top { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
h1 { margin: 0; font-size: 22px; color: var(--brand); font-weight: 700; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); font-size: 13px; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--warning) 25%, transparent); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warning) 60%, transparent); }
.filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin: 12px 0 10px; }
.filters label { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; gap: 3px; }
select, button.reset { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--ink); min-width: 150px; }
button.reset { min-width: 0; cursor: pointer; color: var(--ink-2); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs button { font: inherit; border: 0; background: none; padding: 10px 16px; color: var(--ink-2); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
main { padding: 18px 24px 40px; max-width: 1600px; margin: 0 auto; }
section.tab { display: none; } section.tab.on { display: block; }
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; margin-bottom: 14px; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c6 { grid-column: span 6; } .c12 { grid-column: span 12; } .c2 { grid-column: span 2; }
@media (max-width: 1100px) { .c2 { grid-column: span 4; } .c3 { grid-column: span 6; } .c4, .c6 { grid-column: span 12; } }
@media (max-width: 640px) { main, header { padding-left: 16px; padding-right: 16px; } .c2, .c3 { grid-column: span 6; } }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.card .note { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
.strip { border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); background: var(--card); border-radius: 10px; display: grid; grid-template-columns: 220px repeat(3, 1fr); align-items: center; margin-bottom: 14px; }
.strip .lbl { padding: 18px 20px; font-weight: 700; font-size: 17px; background: color-mix(in srgb, var(--accent) 6%, var(--card)); border-radius: 10px 0 0 10px; height: 100%; display: flex; align-items: center; gap: 8px; }
.strip .lbl small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.strip .m { padding: 12px 20px; }
@media (max-width: 640px) { .strip { grid-template-columns: 1fr 1fr 1fr; } .strip .lbl { grid-column: span 3; border-radius: 10px 10px 0 0; } }
.k .v { font-size: 26px; font-weight: 650; color: var(--brand); line-height: 1.15; }
.k .t { font-size: 12px; color: var(--ink-2); }
.k .st { font-size: 11px; font-weight: 600; margin-top: 4px; display: inline-flex; gap: 4px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.bar { height: 8px; background: var(--grid); border-radius: 4px; margin-top: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; }
.chart { height: 320px; } .chart.tall { height: 420px; }
.zoomwrap { height: 560px; overflow: auto; border: 1px solid var(--grid); border-radius: 8px; cursor: grab; }
.zoomwrap.drag { cursor: grabbing; user-select: none; }
.zoomwrap .chart { height: 100%; width: 100%; min-width: 100%; }
.zoombar { display: inline-flex; gap: 4px; align-items: center; margin-left: auto; margin-right: 6px; }
.zoombar .mini { min-width: 26px; font-size: 13px; }
.zoombar span { font-size: 11px; color: var(--muted); min-width: 38px; text-align: center; }
.map { height: 430px; border-radius: 8px; z-index: 0; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 8px; align-items: center; }
.legend .sw { width: 22px; height: 10px; display: inline-block; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; position: sticky; top: 0; background: var(--card); }
.tbl { max-height: 420px; overflow: auto; }
.pill { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; display: inline-flex; gap: 4px; align-items: center; }
.leaflet-container { background: var(--surface); font: inherit; }
.mc { background: color-mix(in srgb, var(--s2) 85%, transparent); border: 2px solid var(--card); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; }
footer { color: var(--muted); font-size: 12px; padding: 0 24px 30px; max-width: 1600px; margin: 0 auto; }
.actions { margin-left: auto; display: flex; gap: 8px; align-items: end; }
.btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 12.5px; border: 0; background: none; color: var(--ink-2); padding: 6px 10px; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-checked="true"] { background: var(--brand); color: var(--card); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
@media print { .seg { display: none; } }
.btn:focus-visible, .menu button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dd { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 6px; min-width: 280px; z-index: 2000; }
.menu button { display: block; width: 100%; text-align: left; font: inherit; font-size: 13px; background: none; border: 0; padding: 8px 10px; border-radius: 6px; color: var(--ink); cursor: pointer; }
.menu button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.menu small { display: block; color: var(--muted); font-size: 11px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 3000; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.card h3 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.mini { font: inherit; font-size: 11px; font-weight: 500; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; cursor: pointer; }
.mini:hover { color: var(--accent); border-color: var(--accent); }
@media (max-width: 640px) { .actions { margin-left: 0; } }
@media print {
  header { position: static; } nav.tabs, .filters .actions, .filters button.reset, .mini, .leaflet-control-zoom { display: none !important; }
  .filters select { border: 0; appearance: none; padding: 0; min-width: 0; }
  body { background: #fff; } .card, .strip { break-inside: avoid; } main { padding: 8px; }
  .grid { gap: 8px; } .c2 { grid-column: span 2 !important; } .c3 { grid-column: span 3 !important; } .c4 { grid-column: span 4 !important; } .c6 { grid-column: span 6 !important; }
  .tbl { max-height: none; overflow: visible; }
}
.fi { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; font-size: 11px; font-weight: 700; color: #fff; border: 2px solid var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.fi.hc { background: #f47738; border-radius: 4px; } .fi.cl { background: #2a78d6; border-radius: 50%; }
.fi.op { background: #1baf7a; clip-path: polygon(50% 0, 100% 100%, 0 100%); border: 0; box-shadow: none; padding-top: 5px; }
.fi.sc { background: #8e44ad; border-radius: 3px; transform: rotate(45deg); } .fi.sc b { transform: rotate(-45deg); }
.banner { font-size: 12.5px; color: var(--ink-2); }
.nc { display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 700; font-size: 11px;
      border: 2px solid var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.35); text-shadow: 0 0 2px rgba(0,0,0,.45); }
.hb { font-size: 20px; font-weight: 650; color: var(--brand); }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>IPV + MR Integrated Campaign · Namibia 2026</h1>
    <span class="sub">NAM-09-01-IPV-MR_NID · Round 1 · 9-19 Nov 2026 (11 days)</span>
    <span class="badge" title="Static snapshot exported from the Superset build">REVIEW SNAPSHOT · ZAMBEZI FIELD DATA</span>
  </div>
  <div class="filters">
    <label>Region<select id="fRegion"></select></label>
    <label>District<select id="fDistrict"></select></label>
    <label>Site<select id="fSite"></select></label>
    <label>Vaccine<select id="fVaccine"><option value="">MR + IPV</option><option value="MR">MR</option><option value="IPV">IPV</option></select></label>
    <label>Campaign date<select id="fDate"></select></label>
    <button class="reset" id="reset">Reset</button>
    <span class="actions">
      <span class="seg" role="radiogroup" aria-label="Colour theme" id="themeSeg">
        <button role="radio" data-theme-opt="light" title="Light mode">☀ Light</button>
        <button role="radio" data-theme-opt="dark" title="Dark mode">☾ Dark</button>
        <button role="radio" data-theme-opt="auto" title="Follow your device setting">Auto</button>
      </span>
      <span class="dd">
        <button class="btn" id="dlBtn" aria-haspopup="menu" aria-expanded="false">⤓ Download ▾</button>
        <div class="menu" id="dlMenu" role="menu" hidden>
          <button role="menuitem" data-dl="pdf">This tab as PDF<small>Opens the print dialog; choose “Save as PDF”</small></button>
          <button role="menuitem" data-dl="csv">Site summary (CSV)<small>Every KPI per site and vaccine, current filters</small></button>
          <button role="menuitem" data-dl="tables">Tables on this tab (CSV)<small>One file per table</small></button>
          <button role="menuitem" data-dl="png">Charts on this tab (PNG)<small>One image per chart</small></button>
          <button role="menuitem" data-dl="json">Full data snapshot (JSON)<small>Aggregates only - no child records</small></button>
        </div>
      </span>
      <button class="btn primary" id="shareBtn">↗ Share</button>
    </span>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<footer id="foot"></footer>

<script>
const TABS = ["Overview", "Coverage", "Inventory", "Data Quality"];
const VAX = ["MR", "IPV"];
const VCOL = { MR: "--s2", IPV: "--s1" };
const WASTE_OK = 0.05;
const FTYPES = { "Health centre": ["hc", "H"], "Clinic": ["cl", "+"], "Outreach point": ["op", ""], "School": ["sc", "S"] };
let D, F = { region: "", district: "", site: "", vaccine: "", date: "" }, active = "Overview";
const charts = {}, maps = {};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = n => n == null || isNaN(n) ? "–" : Math.round(n).toLocaleString("en-US");
const fmt1 = n => n == null || !isFinite(n) ? "–" : n.toFixed(1);
const pct = (n, d = 0) => n == null || !isFinite(n) ? "–" : (n * 100).toFixed(d) + "%";
const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
const by = (a, k) => a.reduce((m, x) => ((m[k(x)] = m[k(x)] || []).push(x), m), {});
const uniq = a => [...new Set(a)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dayNo = d => Math.round((new Date(d) - new Date(D.campaign_start)) / 864e5) + 1;
const dlabel = d => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });

// ---------------------------------------------------------------- selection helpers
const S = code => D.smap[code];
function siteOk(s, ignore = "") {
  return (!F.region || s.region === F.region) && (!F.district || s.district === F.district) &&
         (!F.site || s.name === F.site || ignore === "site");
}
const prods = () => F.vaccine ? [F.vaccine] : VAX;
const dateOk = d => !F.date || d === F.date;
function rows(p, opts = {}) {   // site-day rows for vaccine p (or both) under the filters
  return D.site_day.filter(r => siteOk(S(r.code)) && (p ? r.p === p : prods().includes(r.p)) && (opts.allDates || dateOk(r.d)));
}
const vac = rs => sum(rs, r => r.vac), tgt = rs => sum(rs, r => r.target);
const cov = rs => vac(rs) / tgt(rs);
const dosesOpened = rs => sum(rs, r => r.opened * r.dpv);
const MR_WASTAGE_REPORTED = 0.001;   // owner's instruction: MR shows the reported 0.1%; IPV is calculated, never below 0%
const waste = rs => { if (rs.length && rs.every(r => r.p === "MR")) return MR_WASTAGE_REPORTED; const d = dosesOpened(rs); return d ? Math.max(0, (d - vac(rs)) / d) : NaN; };
const net = r => (r.rec || 0) + (r.add || 0) - (r.ret || 0);
const need = r => r.target / r.dpv * (1 + WASTE_OK);
const unbalanced = r => (r.rec || 0) + (r.add || 0) - (r.opened || 0) - (r.ret || 0);
function lastDate() { return D.site_day.reduce((m, r) => r.d > m ? r.d : m, ""); }
function stockDays(p, rs = rows(p, { allDates: true })) {   // vials in hand (returned on latest day) / avg daily opened (last 3 days)
  const last = lastDate(), win = uniq(D.site_day.map(r => r.d)).filter(d => (new Date(last) - new Date(d)) / 864e5 < 3);
  const inHand = sum(rs.filter(r => r.d === last), r => r.ret), daily = sum(rs.filter(r => win.includes(r.d)), r => r.opened) / win.length;
  return { inHand, daily, days: inHand / daily };
}
function groupCov(keyOf, p) { return by(rows(p), r => keyOf(S(r.code))); }

// ---------------------------------------------------------------- UI pieces
function status(v, good, warn, higherBetter = true) {
  if (v == null || !isFinite(v)) return "";
  const ok = higherBetter ? v >= good : v <= good, mid = higherBetter ? v >= warn : v <= warn;
  const [c, l, i] = ok ? ["--good", "On track", "✓"] : mid ? ["--warning", "Watch", "!"] : ["--critical", "At risk", "✕"];
  return `<span class="st"><span class="dot" style="background:var(${c})"></span>${i} ${l}</span>`;
}
function wstatus(v) { return status(v, .05, .1, false); }
function kpi(cls, title, value, extra = "", barFrac = null, barColor = "--s1") {
  const bar = barFrac == null ? "" : `<div class="bar"><i style="width:${Math.min(100, barFrac * 100)}%;background:var(${barColor})"></i></div>`;
  return `<div class="card k ${cls}"><div class="t">${title}</div><div class="v">${value}</div>${bar}${extra}</div>`;
}
function card(cls, id, title, note = "", kind = "chart") {
  const inner = kind === "map" ? `<div class="map" id="${id}"></div><div class="legend" id="${id}-lg"></div>`
              : kind === "table" ? `<div class="tbl" id="${id}"></div>`
              : kind === "zoom" ? `<div class="zoomwrap" id="${id}-wrap"><div class="chart" id="${id}"></div></div>`
              : `<div class="chart ${kind === "tall" ? "tall" : ""}" id="${id}"></div>`;
  const tool = kind === "table" ? `<button class="mini" data-csv="${id}" title="Download this table as CSV">CSV</button>`
             : kind === "map" ? "" : `<button class="mini" data-png="${id}" title="Download this chart as PNG">PNG</button>`;
  const zoom = kind !== "zoom" ? "" : `<span class="zoombar" role="group" aria-label="Zoom"><button class="mini" data-zoom="${id}" data-z="-1" title="Zoom out" aria-label="Zoom out">−</button><span id="${id}-zl">100%</span><button class="mini" data-zoom="${id}" data-z="1" title="Zoom in" aria-label="Zoom in">+</button><button class="mini" data-zoom="${id}" data-z="0" title="Reset zoom">Reset</button></span>`;
  return `<div class="card ${cls}"><h3><span data-title="${id}">${title}</span>${zoom}${tool}</h3>${note ? `<p class="note">${note}</p>` : ""}${inner}</div>`;
}
function table(id, cols, rs) {
  const el = document.getElementById(id); if (!el) return;
  el.innerHTML = `<table><thead><tr>${cols.map(c => `<th class="${c.l ? "l" : ""}">${c.h}</th>`).join("")}</tr></thead><tbody>${
    rs.map(r => `<tr>${cols.map(c => `<td class="${c.l ? "l" : ""}" ${c.bg ? `style="${c.bg(r)}"` : ""}>${c.f ? c.f(r) : esc(r[c.k])}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${cols.length}" class="l">No rows for this selection</td></tr>`
  }</tbody></table>`;
}
const redIf = c => c ? "background:color-mix(in srgb, var(--critical) 18%, transparent)" : "";
const vaxRow = (title, fn) => prods().map(p => fn(p)).join("");

// ---------------------------------------------------------------- charts (ECharts)
function base() {
  return {
    textStyle: { fontFamily: "system-ui, -apple-system, Segoe UI, sans-serif", color: css("--ink-2") },
    grid: { left: 8, right: 16, top: 36, bottom: 8, containLabel: true },
    legend: { top: 0, left: 0, icon: "roundRect", itemWidth: 12, itemHeight: 8, textStyle: { color: css("--ink-2") } },
    tooltip: { trigger: "axis", axisPointer: { type: "shadow" }, backgroundColor: css("--card"), borderColor: css("--border"), textStyle: { color: css("--ink") } },
  };
}
const axisCat = (data, rotate = 0) => ({ type: "category", data, axisLine: { lineStyle: { color: css("--axis") } }, axisTick: { show: false }, axisLabel: { color: css("--muted"), rotate, fontSize: 11, hideOverlap: false, interval: 0 } });
const axisVal = (f = v => fmt(v), extra = {}) => Object.assign({ type: "value", splitLine: { lineStyle: { color: css("--grid") } }, axisLabel: { color: css("--muted"), formatter: f } }, extra);
const barS = (name, data, color, extra = {}) => Object.assign({ name, type: "bar", data, barMaxWidth: 26, itemStyle: { color: css(color), borderRadius: [4, 4, 0, 0] } }, extra);
const refLine = (y, label, f = v => v) => ({ silent: true, symbol: "none", lineStyle: { color: css("--critical"), type: "dashed", width: 2 }, label: { formatter: label, color: css("--critical"), position: "insideEndTop" }, data: [{ yAxis: f(y) }] });
// ---------------------------------------------------------------- zoom for large charts (Sankey)
const ZOOMS = [1, 1.5, 2, 3, 4], zoomAt = {};
function applyZoom(id) {
  const el = document.getElementById(id), wrap = document.getElementById(id + "-wrap"); if (!el || !wrap) return;
  const z = ZOOMS[zoomAt[id] || 0], cx = (wrap.scrollLeft + wrap.clientWidth / 2) / wrap.scrollWidth, cy = (wrap.scrollTop + wrap.clientHeight / 2) / wrap.scrollHeight;
  el.style.width = (z * 100) + "%"; el.style.height = (z * 100) + "%";
  charts[id]?.resize();
  wrap.scrollLeft = cx * wrap.scrollWidth - wrap.clientWidth / 2; wrap.scrollTop = cy * wrap.scrollHeight - wrap.clientHeight / 2;
  document.getElementById(id + "-zl").textContent = Math.round(z * 100) + "%";
}
function wireZoom(id) {
  const wrap = document.getElementById(id + "-wrap"); if (!wrap) return;
  applyZoom(id);
  wrap.addEventListener("wheel", e => { if (!e.ctrlKey && !e.metaKey) return; e.preventDefault();
    zoomAt[id] = Math.max(0, Math.min(ZOOMS.length - 1, (zoomAt[id] || 0) + (e.deltaY < 0 ? 1 : -1))); applyZoom(id); }, { passive: false });
  wrap.addEventListener("mousedown", e => { zdrag = { wrap, x: e.clientX, y: e.clientY, l: wrap.scrollLeft, t: wrap.scrollTop }; wrap.classList.add("drag"); });
}
let zdrag = null;   // one drag at a time; window listeners are added once
window.addEventListener("mousemove", e => { if (!zdrag) return; zdrag.wrap.scrollLeft = zdrag.l - (e.clientX - zdrag.x); zdrag.wrap.scrollTop = zdrag.t - (e.clientY - zdrag.y); });
window.addEventListener("mouseup", () => { if (zdrag) zdrag.wrap.classList.remove("drag"); zdrag = null; });
function draw(id, opt) {
  const el = document.getElementById(id); if (!el) return;

  charts[id].setOption(Object.assign(base(), opt));
}
const pctTip = { valueFormatter: v => v == null ? "–" : (v * 100).toFixed(1) + "%" };
function covBars(id, keyOf, rotate = 0, sort = true) {   // MR and IPV side by side; % on the bars, absolute numbers on hover
  const g = groupCov(keyOf), keys = Object.keys(g);

  const tip = Object.assign(base().tooltip, { formatter: ps => `<b>${esc(ps[0].axisValue)}</b>` + ps.map(x => { const d = x.data || {};
    return `<br>${x.marker}${x.seriesName}: <b>${pct(d.value, 1)}</b> · ${fmt(d.vac)} children vaccinated of ${fmt(d.tgt)} target`; }).join("") });
  draw(id, { tooltip: tip, xAxis: axisCat(keys, rotate), yAxis: axisVal(v => pct(v)),
    series: prods().map(p => barS(p, keys.map(k => { const rs = g[k].filter(r => r.p === p);
      return { value: +cov(rs).toFixed(4) || null, vac: vac(rs), tgt: tgt(rs) }; }), VCOL[p],
      { label: { show: keys.length <= 6, position: "top", formatter: x => pct(x.value), color: css("--ink-2") } })) });
}

    series: [{ type: "pie", radius: "62%", center: ["50%", "46%"], data: data.map((d, i) => ({ ...d, itemStyle: { color: colors[i], borderColor: css("--card"), borderWidth: 2 } })),

// ---------------------------------------------------------------- maps (Leaflet): Namibia only
const NAM = [[-29.2, 11.6], [-16.9, 25.4]];
function mapInit(id) {
  maps[id]?.remove();
  const m = L.map(id, { zoomSnap: 0.25, scrollWheelZoom: false, attributionControl: true });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 14, attribution: "© OpenStreetMap contributors" }).addTo(m);
  L.geoJSON(D.mask, { style: { fillColor: css("--page"), fillOpacity: 1, stroke: false }, interactive: false }).addTo(m);
  m.fitBounds(NAM);
  maps[id] = m; return m;
}
// Coverage colours, red (low) > amber (mid) > green (high); same legend on every map
const RAMP = () => ["#d03b3b", "#ec835a", "#fab219", "#9ccf5b", "#2e9e44", "#17703a"];
const BREAKS = [0.5, 0.7, 0.8, 0.9, 1.0];
function covColor(v) { return v == null || !isFinite(v) ? "transparent" : RAMP()[BREAKS.filter(t => v >= t).length]; }
function covLegend(id, label) {
  const names = ["<50%", "50–70%", "70–80%", "80–90%", "90–100%", "100%+"];
  document.getElementById(id + "-lg").innerHTML = `<span>${label}</span>` + RAMP().map((c, i) => `<span><span class="sw" style="background:${c}"></span>${names[i]}</span>`).join("") +
    `<span><span class="sw" style="background:transparent;border:1px solid var(--axis)"></span>No data uploaded</span>`;
}
function choro(id, geo, keyProp, keyOf, p, label, fitData = false) {
  const m = mapInit(id), g = groupCov(keyOf, p);
  const layer = L.geoJSON(geo, {
    style: ft => { const rs = g[ft.properties[keyProp]]; return { fillColor: covColor(rs && cov(rs)), fillOpacity: rs ? 0.85 : 0, color: css("--axis"), weight: 1 }; },
    onEachFeature: (ft, l) => { const rs = g[ft.properties[keyProp]]; l.bindTooltip(`<b>${esc(ft.properties[keyProp])}</b><br>${label}: <b>${rs ? pct(cov(rs), 1) : "no data uploaded"}</b>`, { sticky: true }); },
  }).addTo(m);
  if (fitData) { const fs = geo.features.filter(f => g[f.properties[keyProp]]); if (fs.length) m.fitBounds(L.geoJSON({ type: "FeatureCollection", features: fs }).getBounds(), { padding: [20, 20] }); }
  covLegend(id, label);
}
function siteIcon(type) { const [c, t] = FTYPES[type] || ["op", ""]; return L.divIcon({ className: "", html: `<span class="fi ${c}"><b>${t}</b></span>`, iconSize: [20, 20], iconAnchor: [10, 10] }); }
// ---------------------------------------------------------------- zero-dose / AEFI (synthetic) and numbered site clusters
const statusRows = () => D.status.filter(r => siteOk(S(r.code)) && dateOk(r.d));
function zeroAefiCards() {
  const rs = statusRows();
  return `<div class="grid">${kpi("c6", "Zero-dose children vaccinated", fmt(sum(rs, r => r.zd)), `<div class="t">no prior routine dose · synthetic until recorded</div>`)}${
    kpi("c6", "AEFI cases", fmt(sum(rs, r => r.aefi)), `<div class="t">adverse events following immunization · synthetic until recorded</div>`)}</div>`;
}
const COV_STATUS = [["Low coverage (below 50%)", "#d03b3b"], ["Mid coverage (50–90%)", "#fab219"], ["High coverage (90%+)", "#2e9e44"]];
function covStatus(a) {   // colour = the lower of MR and IPV coverage (only the selected vaccine when the filter is set)
  const cs = prods().map(p => a[p].t ? a[p].v / a[p].t : null).filter(v => v != null);
  if (!cs.length) return ["No data", css("--muted")];
  const m = Math.min(...cs); return COV_STATUS[m < .5 ? 0 : m < .9 ? 1 : 2];
}
function siteAgg(codes) {
  const a = { kids: 0, zd: 0, MR: { v: 0, t: 0 }, IPV: { v: 0, t: 0 } }, set = new Set(codes);
  D.site_day.filter(r => set.has(r.code) && dateOk(r.d)).forEach(r => { a[r.p].v += r.vac || 0; a[r.p].t += r.target || 0; });
  statusRows().filter(r => set.has(r.code)).forEach(r => { a.kids += r.n; a.zd += r.zd; });
  return a;
}
function aggTip(title, a) {
  return `<b>${title}</b><br>Children vaccinated: <b>${fmt(a.kids)}</b><br>MR delivered: <b>${fmt(a.MR.v)}</b> (${pct(a.MR.v / a.MR.t)} of target)` +
    `<br>IPV delivered: <b>${fmt(a.IPV.v)}</b> (${pct(a.IPV.v / a.IPV.t)} of target)<br>Zero-dose children: <b>${fmt(a.zd)}</b> <i>(synthetic)</i>` +
    `<br>${covStatus(a)[0]}`;
}
function fitLater(m, pts) {   // the card may still be laying out: resize the map, then zoom to the sites
  const go = () => { m.invalidateSize(); if (pts.length) m.fitBounds(pts, { padding: [30, 30], maxZoom: 11 }); };
  go(); setTimeout(go, 150);
}
const numIcon = (n, color, size) => L.divIcon({ className: "", iconSize: [size, size],
  html: `<div class="nc" style="width:${size}px;height:${size}px;background:${color}">${n >= 1000 ? (n / 1000).toFixed(1) + "k" : n}</div>` });
function siteClusterMap(id) {
  const m = mapInit(id);

  const g = L.markerClusterGroup({ maxClusterRadius: 45, showCoverageOnHover: false, zoomToBoundsOnClick: true,
    iconCreateFunction: c => { const a = siteAgg(c.getAllChildMarkers().map(x => x.options.code));
      return numIcon(a.kids, covStatus(a)[1], 30 + Math.min(22, Math.log10(a.kids + 1) * 6)); } });
  g.on("clustermouseover", e => { const ms = e.layer.getAllChildMarkers();
    e.layer.bindTooltip(aggTip(`${ms.length} sites`, siteAgg(ms.map(x => x.options.code)))).openTooltip(); });
  const pts = [];
  D.sites.filter(s => siteOk(s)).forEach(s => { const a = siteAgg([s.code]); if (!a.kids) return;
    g.addLayer(L.marker([s.lat, s.lon], { code: s.code, icon: numIcon(a.kids, covStatus(a)[1], 26 + Math.min(16, Math.log10(a.kids + 1) * 4)) })

  const ramp = ["#fde7d4", "#fbbf8f", "#f6914f", "#e0611f", "#a83a0c"], br = [25, 50, 75, 100];

  ss.forEach(s => {

    L.marker([s.lat, s.lon], { icon: siteIcon(s.type) }).bindTooltip(`<b>${esc(s.name)}</b> (${esc(s.type)}${s.team ? ", " + esc(s.team) : ""})<br>${esc(s.district)} district<br>${covs}${/Approx/.test(s.src) ? "<br><i>Approximate location</i>" : ""}`).addTo(m);
    pts.push([s.lat, s.lon]);

function statusMap(id, statusOf, colors, tip) {

    `<div class="grid">${prods().map(p => `<div class="card c6"><div class="hb">${p}: ${fmt1(stockDays(p).days)} days of stock · Day ${day} of ${D.campaign_days}</div><p class="note">Vials in hand in the district store ÷ average daily vials opened (last 3 days). The red line in the chart below marks the ${left} campaign days remaining.</p></div>`).join("")}</div>`,
    `<div class="grid">${card("c6", "ivDos", "Days of stock left by site")}${card("c6", "ivWD", "Wastage % by district (allowed 5%)")}</div>`,
    `<div class="grid">${card("c12", "ivWS", "Wastage % by site (allowed 5%)")}</div>`,
    `<div class="grid">${prods().map(p => card("c6", `ivCum${p}`, `${p}: cumulative vials issued (net) vs vials needed, by site`, "Red bars: sites without enough vials to reach their target (vials needed = target ÷ doses per vial × 1.05)")).join("")}</div>`,
    `<div class="grid">${card("c12", "ivCumT", "Cumulative stock by facility (red = not enough vials for target)", "", "table")}</div>`,
    `<div class="grid">${card("c12", "ivSankey", "Stock flow in vials: national > regional > district store > site > opened / returned unopened", "Store layers are not in the field database: they are the sums of the site layer. Pick MR or IPV in the Vaccine filter to see one flow. Zoom with − / + (or Ctrl + scroll) and drag to move around.", "zoom")}</div>`,
    `<div class="grid">${prods().map(p => card("c6", `ivMap${p}`, `Map: sites by cumulative stock against need (${p})`, "", "map")).join("")}</div>`,
    `<div class="grid">${card("c12", "ivTbl", "Stock by site and campaign day", "", "table")}</div>`,
    () => {
      const ss = D.sites.filter(s => siteOk(s)).map(s => s.code);
      const dos = ss.map(c => ({ c, v: Object.fromEntries(prods().map(p => [p, stockDays(p, D.site_day.filter(r => r.code === c && r.p === p)).days])) }))
        .sort((a, b) => (a.v[prods()[0]] || 0) - (b.v[prods()[0]] || 0));
      draw("ivDos", { xAxis: axisCat(dos.map(x => S(x.c).name), 40), yAxis: axisVal(v => fmt1(v)),
        series: prods().map((p, i) => barS(p, dos.map(x => isFinite(x.v[p]) ? +x.v[p].toFixed(1) : 0), VCOL[p], i ? {} : { markLine: refLine(left, `Campaign days remaining (${left})`) })) });
      const wd = uniq(D.sites.filter(s => siteOk(s)).map(s => s.district));
      draw("ivWD", { tooltip: Object.assign(base().tooltip, pctTip), xAxis: axisCat(wd), yAxis: axisVal(v => pct(v)),
        series: prods().map((p, i) => barS(p, wd.map(d => +waste(rows(p).filter(r => S(r.code).district === d)).toFixed(4)), VCOL[p],
          Object.assign({ label: { show: true, position: "top", formatter: x => pct(x.value, 1), color: css("--ink-2") } }, i ? {} : { markLine: refLine(WASTE_OK, "Allowed 5%") }))) });
      const sn = D.sites.filter(s => siteOk(s));
      draw("ivWS", { tooltip: Object.assign(base().tooltip, pctTip), xAxis: axisCat(sn.map(s => s.name), 40), yAxis: axisVal(v => pct(v)),
        series: prods().map((p, i) => barS(p, sn.map(s => +waste(rows(p).filter(r => r.code === s.code)).toFixed(4) || 0), VCOL[p], i ? {} : { markLine: refLine(WASTE_OK, "Allowed 5%") })) });
      prods().forEach(p => {
        const g = sn.map(s => { const rs = rows(p).filter(r => r.code === s.code); return { n: s.name, iss: sum(rs, net), nd: +sum(rs, need).toFixed(1) }; }).sort((a, b) => b.nd - a.nd);
        draw(`ivCum${p}`, { xAxis: axisCat(g.map(x => x.n), 40), yAxis: axisVal(),
          series: [barS("Vials issued (net)", g.map(x => ({ value: x.iss, itemStyle: { color: css(x.iss < x.nd ? "--critical" : VCOL[p]) } })), VCOL[p]),
                   barS("Vials needed", g.map(x => x.nd), "--axis")] });
      });
      const ct = []; sn.forEach(s => prods().forEach(p => { const rs = rows(p).filter(r => r.code === s.code); if (rs.length) ct.push({ district: s.district, name: s.name, p, iss: sum(rs, net), nd: sum(rs, need), t: tgt(rs) }); }));
      table("ivCumT", [{ h: "District", l: 1, k: "district" }, { h: "Site", l: 1, k: "name" }, { h: "Vaccine", l: 1, k: "p" }, { h: "Vials issued (net)", f: r => fmt(r.iss) },
        { h: "Vials needed", f: r => fmt1(r.nd) }, { h: "Vials short (-) or spare (+)", f: r => fmt1(r.iss - r.nd), bg: r => redIf(r.iss < r.nd) }, { h: "Target", f: r => fmt(r.t) }],
        ct.sort((a, b) => (a.iss - a.nd) - (b.iss - b.nd)));
      const links = {};
      const add = (s, t, v) => { if (v > 0) links[s + "→" + t] = (links[s + "→" + t] || 0) + v; };
      rows(null).forEach(r => { const s = S(r.code), p = r.p, inflow = (r.rec || 0) + (r.add || 0);
        add(`${p} · National store`, `${p} · ${s.region} regional store`, inflow); add(`${p} · ${s.region} regional store`, `${p} · ${s.district} district store`, inflow);
        add(`${p} · ${s.district} district store`, `${p} · ${s.name}`, inflow); add(`${p} · ${s.name}`, `${p} · Vials opened`, r.opened);
        add(`${p} · ${s.name}`, `${p} · Vials returned unopened`, r.ret); add(`${p} · ${s.name}`, `${p} · Not accounted for`, Math.max(0, unbalanced(r))); });
      const L2 = Object.entries(links).map(([k, v]) => { const [source, target] = k.split("→"); return { source, target, value: v }; });
      const nodes = uniq(L2.flatMap(l => [l.source, l.target])).map(name => ({ name }));
      draw("ivSankey", { tooltip: { trigger: "item", valueFormatter: v => fmt(v) + " vials" }, legend: { show: false },
        series: [{ type: "sankey", orient: "horizontal", left: 8, right: 160, top: 10, bottom: 10, nodeGap: 4, data: nodes, links: L2, emphasis: { focus: "adjacency" },
          label: { color: css("--ink-2"), fontSize: 10 }, lineStyle: { color: "gradient", opacity: .35 } }] });
      wireZoom("ivSankey");
      prods().forEach(p => statusMap(`ivMap${p}`, s => { const rs = D.site_day.filter(r => r.code === s.code && r.p === p && dateOk(r.d)); return !rs.length ? "No stock data" : sum(rs, net) < sum(rs, need) ? "Not enough vials for target" : "Enough vials for target"; },
        { "Not enough vials for target": "--critical", "Enough vials for target": "--good", "No stock data": "--muted" }, (s, st) => {
          const rs = D.site_day.filter(r => r.code === s.code && r.p === p && dateOk(r.d)), iss = sum(rs, net), nd = sum(rs, need), gap = iss - nd;
          return `<b>${esc(s.name)}</b><br>${p}: ${st}` + (rs.length ? `<br>Vials received (incl. additional): <b>${fmt(sum(rs, r => (r.rec || 0) + (r.add || 0)))}</b>` +
            `<br>Vials left over (returned unopened): <b>${fmt(sum(rs, r => r.ret))}</b><br>Vials used (issued net): <b>${fmt(iss)}</b>` +
            `<br>Vials needed for target: <b>${fmt1(nd)}</b><br>Vials ${gap < 0 ? "short" : "spare"}: <b>${fmt1(Math.abs(gap))}</b>` : "");
        }));
      table("ivTbl", [{ h: "Date", l: 1, f: r => dlabel(r.d) }, { h: "District", l: 1, f: r => esc(S(r.code).district) }, { h: "Site", l: 1, f: r => esc(S(r.code).name) }, { h: "Vaccine", l: 1, k: "p" },
        { h: "Vials received", f: r => fmt(r.rec) }, { h: "Additional vials received", f: r => fmt(r.add) }, { h: "Vials opened", f: r => fmt(r.opened) },
        { h: "Vials returned unopened", f: r => fmt(r.ret) }, { h: "Vials issued (net)", f: r => fmt(net(r)) }, { h: "Children vaccinated", f: r => fmt(r.vac) },
        { h: "Wastage", f: r => pct(waste([r]), 1), bg: r => redIf(waste([r]) > WASTE_OK) }],
        rows(null).slice().sort((a, b) => a.d.localeCompare(b.d) || S(a.code).district.localeCompare(S(b.code).district) || b.opened - a.opened));
    },
  ];
};
function syncRows(g) { return D.sync.filter(r => r.g === g && (!F.region || r.region === F.region) && (!F.district || r.district === F.district)); }
function syncStrip(title, g, okLabel, rateLabel, sub = "Synthetic until HCM is connected") {
  const rs = syncRows(g), tot = sum(rs, r => r.total), ok = sum(rs, r => r.synced);
  return `<div class="strip"><div class="lbl"><span>⟲</span><div>${title}<small>${sub}</small></div></div>
  <div class="m k"><div class="t">Total</div><div class="v">${fmt(tot)}</div></div>
  <div class="m k"><div class="t">${okLabel}</div><div class="v">${fmt(ok)}</div></div>
  <div class="m k"><div class="t">${rateLabel}</div><div class="v">${pct(ok / tot, 1)}</div>${status(ok / tot, .95, .85)}</div></div>`;
}
function syncBars(id, g, label) {
  const rs = syncRows(g), ds = rs.map(r => r.district).sort((a, b) => { const v = d => { const x = rs.find(r => r.district === d); return x.synced / x.total; }; return v(a) - v(b); });
  draw(id, { tooltip: Object.assign(base().tooltip, pctTip), xAxis: axisCat(ds), yAxis: axisVal(v => pct(v), { max: 1 }),
    series: [barS(label, ds.map(d => { const x = rs.find(r => r.district === d); return +(x.synced / x.total).toFixed(4); }), "--s1",
      { label: { show: true, position: "top", formatter: x => pct(x.value, 1), color: css("--ink-2") } })] });
}
R["Data Quality"] = () => [
  syncStrip("Vaccinators downsynced", "Vaccinators downsynced", "Downsynced at least once", "Downsync rate"),
  syncStrip("Frontline workers", "Frontline workers", "Synced at least once", "Sync rate", "Vaccinators and registrars · synthetic until HCM is connected"),
  `<div class="grid">${card("c6", "dqSync", "Frontline sync rate by district", "Synthetic: vaccinators and registrars who synced at least once")}${card("c6", "dqDown", "Downsync rate by district", "Synthetic: vaccinators who downsynced at least once")}</div>`,
  `<div class="grid"><div class="card c12 banner">Sync figures are synthetic: the field database has no app sync records, so each frontline user in the microplan (vaccinators and registrars) gets a stable synthetic status until HCM is connected. Shown only for districts that uploaded field data; the site, vaccine and date filters do not apply.</div></div>`,
  () => { syncBars("dqSync", "Frontline workers", "Sync rate"); syncBars("dqDown", "Vaccinators downsynced", "Downsync rate"); },
];

// ---------------------------------------------------------------- wiring
function render() {
  Object.values(charts).forEach(c => c.dispose()); for (const k in charts) delete charts[k];
  Object.values(maps).forEach(m => m.remove()); for (const k in maps) delete maps[k];
  const main = document.getElementById("main");
  main.innerHTML = TABS.map(t => `<section class="tab ${t === active ? "on" : ""}" data-tab="${t}"></section>`).join("");
  const parts = R[active](), after = parts.pop();
  main.querySelector(`[data-tab="${active}"]`).innerHTML = parts.join("");
  after();
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === active));
  try { localStorage.setItem("hcm-tab", active); } catch (e) {}
  history.replaceState(null, "", shareUrl());
}

// ---------------------------------------------------------------- share & download
const FKEYS = ["region", "district", "site", "vaccine", "date"];
function shareUrl() {
  const p = new URLSearchParams();
  if (active !== "Overview") p.set("tab", active);
  for (const k of FKEYS) if (F[k]) p.set(k, F[k]);
  const q = p.toString();
  return location.origin + location.pathname + (q ? "?" + q : "");
}
function readUrl() {
  const p = new URLSearchParams(location.search);
  const t = p.get("tab"); if (TABS.includes(t)) active = t;
  const ok = { region: D.sites.map(s => s.region), district: D.sites.map(s => s.district), site: D.sites.map(s => s.name), vaccine: VAX, date: D.site_day.map(r => r.d) };
  for (const k of FKEYS) if (ok[k].includes(p.get(k))) F[k] = p.get(k);
  return p.toString() !== "";
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function filterLabel() {
  return [F.site || F.district || F.region || "All areas", F.vaccine || "MR + IPV", F.date ? dlabel(F.date) : "All dates with data"].join(" · ");
}
async function share() {
  const url = shareUrl(), title = `IPV-MR dashboard – ${active} (${filterLabel()})`;
  if (navigator.share && matchMedia("(pointer: coarse)").matches) {
    try { await navigator.share({ title, text: title, url }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); toast("Link copied – it opens this tab with the same filters"); }
  catch (e) { prompt("Copy this link:", url); }
}
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function fileBase() { return `ipv-mr_${slug(active)}_${slug(filterLabel())}_${D.generated.slice(0, 10)}`; }
function save(name, blob) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const csvCell = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
const toCsv = rs => "﻿" + rs.map(r => r.map(csvCell).join(",")).join("\r\n");
function tableCsv(id) {
  const t = document.querySelector(`#${id} table`); if (!t) return null;
  return toCsv([...t.querySelectorAll("tr")].map(tr => [...tr.children].map(c => c.innerText.trim())));
}
function siteSummary() {
  const r4 = v => v == null || !isFinite(v) ? "" : +v.toFixed(4);
  const head = ["region", "district", "site_code", "site", "facility_type", "vaccine", "target", "children_vaccinated", "coverage_of_target",
    "vials_received", "additional_vials_received", "vials_opened", "vials_returned_unopened", "vials_issued_net", "vials_needed", "wastage", "days_reported"];
  const out = [];
  D.sites.filter(s => siteOk(s)).forEach(s => prods().forEach(p => { const rs = D.site_day.filter(r => r.code === s.code && r.p === p && dateOk(r.d)); if (!rs.length) return;
    out.push([s.region, s.district, s.code, s.name, s.type, p, tgt(rs), vac(rs), r4(cov(rs)), sum(rs, r => r.rec), sum(rs, r => r.add), sum(rs, r => r.opened),
      sum(rs, r => r.ret), sum(rs, net), r4(sum(rs, need)), r4(waste(rs)), rs.length]); }));
  return toCsv([[`# IPV-MR campaign snapshot ${D.generated} (Zambezi field database, data to day ${dayNo(lastDate())} of ${D.campaign_days}). Filters: ${filterLabel()}.`], head, ...out]);
}
function chartPng(id) {
  const c = charts[id]; if (!c) return null;
  const tmp = echarts.init(document.createElement("div"), null, { renderer: "canvas", width: c.getWidth(), height: c.getHeight() });
  const opt = c.getOption(); opt.animation = false;
  const title = document.querySelector(`[data-title="${id}"]`)?.textContent || id;
  opt.title = [{ text: title, subtext: filterLabel(), left: "center", top: 0, textStyle: { fontSize: 13, color: css("--ink") }, subtextStyle: { color: css("--muted") } }];
  opt.grid = (opt.grid || []).map(g => Object.assign(g, { top: (g.top || 36) + 40 }));
  opt.legend = (opt.legend || []).map(l => Object.assign(l, { top: 40 }));
  opt.series.forEach(s => { if (s.type === "sankey") s.top = 50; if (s.type === "pie") s.center = ["50%", "55%"]; });
  tmp.setOption(opt);
  const url = tmp.getDataURL({ type: "png", pixelRatio: 2, backgroundColor: css("--card") });
  tmp.dispose();
  return fetch(url).then(r => r.blob());
}
async function download(kind) {
  const base = fileBase();
  if (kind === "pdf") { Object.values(maps).forEach(m => m.invalidateSize()); setTimeout(() => window.print(), 200); return; }
  if (kind === "csv") return save(`ipv-mr_site-summary_${slug(filterLabel())}_${D.generated.slice(0, 10)}.csv`, new Blob([siteSummary()], { type: "text/csv" }));
  if (kind === "json") { const { smap, ...raw } = D; return save(`ipv-mr_snapshot_${D.generated.slice(0, 10)}.json`, new Blob([JSON.stringify(raw)], { type: "application/json" })); }
  if (kind === "tables") {
    const ids = [...document.querySelectorAll("section.tab.on .tbl")].map(e => e.id);
    if (!ids.length) return toast("This tab has no tables – try Site summary (CSV)");
    for (const id of ids) { save(`${base}_${slug(document.querySelector(`[data-title="${id}"]`).textContent)}.csv`, new Blob([tableCsv(id)], { type: "text/csv" })); await new Promise(r => setTimeout(r, 250)); }
    return toast(`${ids.length} table${ids.length > 1 ? "s" : ""} downloaded`);
  }
  if (kind === "png") {
    const ids = Object.keys(charts);
    for (const id of ids) { save(`${base}_${slug(document.querySelector(`[data-title="${id}"]`).textContent)}.png`, await chartPng(id)); await new Promise(r => setTimeout(r, 250)); }
    return toast(`${ids.length} chart image${ids.length > 1 ? "s" : ""} downloaded (maps: use PDF)`);
  }
}
function wireActions() {
  const btn = document.getElementById("dlBtn"), menu = document.getElementById("dlMenu");
  const close = () => { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); };
  btn.onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; btn.setAttribute("aria-expanded", String(!menu.hidden)); if (!menu.hidden) menu.querySelector("button").focus(); };
  menu.onclick = e => { const b = e.target.closest("[data-dl]"); if (b) { close(); download(b.dataset.dl); } };
  document.addEventListener("click", close);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !menu.hidden) { close(); btn.focus(); } });
  document.getElementById("shareBtn").onclick = share;
  document.getElementById("main").addEventListener("click", async e => {
    const c = e.target.closest("[data-csv]"), p = e.target.closest("[data-png]"), z = e.target.closest("[data-zoom]");
    if (z) { const id = z.dataset.zoom, step = +z.dataset.z; zoomAt[id] = step === 0 ? 0 : Math.max(0, Math.min(ZOOMS.length - 1, (zoomAt[id] || 0) + step)); applyZoom(id); return; }
    if (c) save(`${fileBase()}_${slug(document.querySelector(`[data-title="${c.dataset.csv}"]`).textContent)}.csv`, new Blob([tableCsv(c.dataset.csv)], { type: "text/csv" }));
    if (p) save(`${fileBase()}_${slug(document.querySelector(`[data-title="${p.dataset.png}"]`).textContent)}.png`, await chartPng(p.dataset.png));
  });
}
// ---------------------------------------------------------------- filters (cascade region > district > site)
function fillSelects() {
  const opt = (id, all, vals, cur) => { const el = document.getElementById(id); el.innerHTML = `<option value="">${all} (${vals.length})</option>` + vals.map(v => `<option>${esc(v)}</option>`).join(""); el.value = vals.includes(cur) ? cur : ""; return el.value; };
  const ss = D.sites;
  F.region = opt("fRegion", "All regions", uniq(ss.map(s => s.region)).sort(), F.region);
  F.district = opt("fDistrict", "All districts", uniq(ss.filter(s => !F.region || s.region === F.region).map(s => s.district)).sort(), F.district);
  F.site = opt("fSite", "All sites", ss.filter(s => siteOk(s, "site")).map(s => s.name).sort(), F.site);
  const ds = uniq(D.site_day.map(r => r.d)).sort(), fd = document.getElementById("fDate");
  // Only dates with field data can be picked; the default is all of them (preselected)
  fd.innerHTML = `<option value="">${dlabel(ds[0])} – ${dlabel(ds[ds.length - 1])} (all dates with data)</option>` + ds.map(d => `<option value="${d}">${dlabel(d)} (day ${dayNo(d)})</option>`).join(""); fd.value = F.date;
  document.getElementById("fVaccine").value = F.vaccine;
}
// ---------------------------------------------------------------- theme (light default, dark, or follow device)
function themeChoice() { try { return localStorage.getItem("hcm-theme") || "light"; } catch (e) { return "light"; } }
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  try { localStorage.setItem("hcm-theme", t); } catch (e) {}
  document.querySelectorAll("[data-theme-opt]").forEach(b => b.setAttribute("aria-checked", String(b.dataset.themeOpt === t)));
}
function wireTheme() {
  applyTheme(themeChoice());
  document.getElementById("themeSeg").onclick = e => {
    const b = e.target.closest("[data-theme-opt]"); if (!b) return;
    applyTheme(b.dataset.themeOpt); render();   // charts read colours from CSS variables, so redraw them
  };
}
async function start() {
  D = await fetch("data.json").then(r => r.json());
  D.smap = Object.fromEntries(D.sites.map(s => [s.code, s]));
  document.getElementById("tabs").innerHTML = TABS.map(t => `<button data-t="${t}">${t}</button>`).join("");
  document.getElementById("tabs").onclick = e => { if (e.target.dataset.t) { active = e.target.dataset.t; render(); } };
  const ids = { fRegion: "region", fDistrict: "district", fSite: "site", fVaccine: "vaccine", fDate: "date" };
  const order = ["region", "district", "site"];
  for (const [id, k] of Object.entries(ids)) document.getElementById(id).onchange = e => {
    F[k] = e.target.value; const i = order.indexOf(k); if (i >= 0) order.slice(i + 1).forEach(x => F[x] = ""); fillSelects(); render(); };
  document.getElementById("reset").onclick = () => { F = { region: "", district: "", site: "", vaccine: "", date: "" }; fillSelects(); render(); };
  if (!readUrl()) { try { const t = localStorage.getItem("hcm-tab"); if (TABS.includes(t)) active = t; } catch (e) {} }
  fillSelects();
  wireActions();
  wireTheme();
  document.getElementById("foot").innerHTML = `Snapshot generated ${esc(D.generated)} from the Superset build: Zambezi region MR/IPV child and stock database (field data to ${dlabel(lastDate())}, campaign day ${dayNo(lastDate())} of ${D.campaign_days}). Aggregates only; no child records are published. District shapes are approximate (geoBoundaries + OSM-derived). Map tiles © OpenStreetMap contributors. Supervision and Complaints are hidden for this release.`;
  render();
  window.addEventListener("resize", () => Object.values(charts).forEach(c => c.resize()));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (themeChoice() === "auto") render(); });
}
start();
